<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kpi – Equipe de Solda</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f3f4;--card:#fff;--tx:#25282c;--mut:#6b6f75;--bd:#dcdde0;--pri:#5F6267;--acc:#EAAC31;--hb:#5F6267;--l1:#EAAC31;--l2:#DC3A2D;--pos:#1a7f45;--neg:#DC3A2D;--bar:#e6e7e9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191c;--card:#222529;--tx:#eceded;--mut:#a0a4aa;--bd:#363a40;--pri:#EAAC31;--acc:#EAAC31;--pos:#6fdc9b;--neg:#ff7a6e;--bar:#363a40}}
:root[data-theme="dark"]{--bg:#17191c;--card:#222529;--tx:#eceded;--mut:#a0a4aa;--bd:#363a40;--pri:#EAAC31;--acc:#EAAC31;--pos:#6fdc9b;--neg:#ff7a6e;--bar:#363a40}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Arial,Helvetica,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:0;color:#fff}
.hb{display:flex;align-items:center;gap:12px;background:var(--hb);padding:12px 16px;border-radius:12px;margin-bottom:12px}
.hs{color:#fff;opacity:.85;font-size:13px;margin-top:1px}
.thb{margin-left:auto;font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.logo{height:34px;width:auto;background:#fff;padding:3px;border-radius:6px;flex:none;display:block}
.sub{color:var(--mut);font-size:13px;margin:2px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;font:inherit;font-size:14px;padding:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--bg);border-color:var(--pri);font-weight:bold;box-shadow:inset 0 -3px 0 var(--l2)}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 9px}
select{width:100%;font-weight:bold;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 12px}
.r{display:grid;grid-template-columns:1fr 78px 78px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.r:last-child{border:0}
.r .n{font-size:14px}.r .n small{display:block;color:var(--mut);font-size:11px}
.r input{width:100%;text-align:center}
.pt{text-align:right;font-weight:bold;font-variant-numeric:tabular-nums}
.hh{font-size:11px;color:var(--mut);text-transform:uppercase;border-bottom:1px solid var(--bd);padding:8px 0}
.hh span:not(:first-child){text-align:center}.hh span:last-child{text-align:right}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;padding:12px 4px}
.p{color:var(--pos)}.m{color:var(--neg)}
.rk{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-bottom:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;cursor:pointer}
.rk .pos{width:26px;color:var(--mut);font-weight:bold}
.rk .b{flex:1}.rk .nm{font-size:14px}
.rk .bar{height:6px;background:var(--bar);border-radius:4px;margin-top:5px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--pos)}
.rk .v{font-weight:bold;font-size:16px;min-width:56px;text-align:right}
.rg{display:grid;grid-template-columns:1fr 64px 12px 72px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.rg input{width:100%;text-align:center;padding:6px 4px}
.btn{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two select:first-child:last-child{grid-column:1/3}
.ml{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px;cursor:pointer}.ml.cur span{font-weight:bold;color:var(--pri)}.ml.tt{border:0;font-weight:bold;cursor:default}
.sc{overflow-x:auto;max-width:100%;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;font-size:12px;width:100%}th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:normal;position:sticky;top:0;background:var(--card)}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.nn{cursor:pointer;color:var(--pri)}.ttr td{font-weight:bold}
.pdf{width:100%;background:var(--pri);color:var(--bg);font-weight:bold;padding:11px}
.x{color:var(--neg);font-size:12px;cursor:pointer;text-decoration:underline;margin-left:6px}
#pv{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.pvb{display:flex;gap:8px;padding:0 16px;position:sticky;top:0;background:var(--bg);z-index:2}.pvb .btn{margin:10px 0 0}
.pvc{padding:12px 16px 24px;max-width:900px;margin:0 auto}.pvc h2{font-size:17px;margin:4px 0 8px;color:var(--pri)}
.ttr td{font-weight:bold}.ft{font-size:11px;color:var(--mut);margin-top:14px}
</style>
</head>

function dvHtml(){var DV=[["Segurança",/seguran/i],["S4",/s4/i],["Ambiental",/ambient/i],["Sistêmico",/sist/i]],dt=0,dh="";
DV.forEach(function(d){var ix=-1;S.rg.forEach(function(r,i){if(ix<0&&!r[5]&&/^desvio/i.test(r[0])&&d[1].test(r[0]))ix=i});var s=0;if(ix>=0)EQ.forEach(function(e){s+=+((((S.q[mk]||{})[e])||{})[ix])||0});dt+=s;dh+='<div style="flex:1;text-align:center"><div style="font-size:22px;font-weight:bold">'+s+'</div><div style="font-size:11px;color:var(--mut)">'+d[0]+'</div></div>'});
return '<div id="dvc" class="c" style="padding:10px 12px;margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:6px"><span>DESVIOS DA EQUIPE – MÊS '+lbl()+'</span><b style="color:var(--tx);font-size:13px">Total: '+dt+'</b></div><div style="display:flex;gap:4px">'+dh+'</div></div>'}
function refreshAll(){var h=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});if(typeof syOn==="function"&&syOn()){syBusy=false;syncNow(false)}render();if(!(typeof syOn==="function"&&syOn())){var e=document.getElementById("sy");if(e)e.textContent="↻ Atualizado às "+h}}
function updDv(){var dc=document.getElementById("dvc");if(dc)dc.outerHTML=dvHtml()}
function render(){
document.getElementById("tb").innerHTML=[["e","Entrega"],["r","Ranking"],["a","Mês a mês"],["g","Cadastro"]].map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("");
var h="";
if(tab!=="g")h+=dvHtml();
if(tab==="e"&&sel===-1){
h+='<div class="two">'+slh()+msel()+'</div>';
h+='<div class="c"><div class="r hh"><span>Relatório (todos)</span><span>Qtd</span><span>Pontos</span></div>';

h+='</div><div class="tot"><span>Total de todos – '+lbl()+'</span><span class="'+cl(atot(mk))+'">'+sg(atot(mk))+'</span></div>';
var fa=0;MS.forEach(function(x){fa+=atot(x.k)});
h+='<div class="c"><div class="hh" style="font-size:12px;color:var(--mut)">EQUIPE – ANO FISCAL MÊS A MÊS</div>'+MS.map(function(x){var t=atot(x.k);return '<div class="ml'+(x.k===mk?" cur":"")+'" data-m="'+x.k+'"><span>'+x.l+'</span><b class="'+cl(t)+'">'+sg(t)+'</b></div>'}).join("")+'<div class="ml tt"><span>Acumulado</span><b class="'+cl(fa)+'">'+sg(fa)+'</b></div></div>';
}
else if(tab==="e"){
var n=EQ[sel];
h+='<div class="two">'+slh()+msel()+'</div>';
h+='<div class="c"><div class="r hh"><span>Relatório</span><span>Qtd</span><span>Pontos</span></div>';
S.rg.forEach(function(r,i){if(r[5])return;
var v=((((S.q[mk]||{})[n])||{})[i]);v=v===undefined?"":v;var p=pts(n,i,mk);
h+='<div class="r"><div class="n">'+r[0]+'<small>'+(r[3]?'% → ':r[1]+' = ')+fm(r[2])+' pts</small></div>'+
'<input type="number" inputmode="decimal" min="0" data-i="'+i+'" value="'+v+'" placeholder="0">'+
'<div class="pt '+cl(p)+'" id="p'+i+'">'+sg(p)+'</div></div>'});
h+='</div><div class="tot"><span>Total '+lbl()+'</span><span id="tt" class="'+cl(tot(n,mk))+'">'+sg(tot(n,mk))+'</span></div>';
h+='<div class="c"><div class="hh" style="font-size:12px;color:var(--mut)">ANO FISCAL – MÊS A MÊS</div>'+MS.map(function(x){var t=tot(n,x.k);return '<div class="ml'+(x.k===mk?" cur":"")+'" data-m="'+x.k+'"><span>'+x.l+'</span><b class="'+cl(t)+'">'+sg(t)+'</b></div>'}).join("")+'<div class="ml tt"><span>Acumulado</span><b class="'+cl(fy(n))+'">'+sg(fy(n))+'</b></div></div>'+
'<input type="text" id="ob" placeholder="Observações do relatório (opcional)" style="width:100%;margin-top:12px" value="'+(S.ob[mk+"|"+n]||"").replace(/"/g,"&quot;")+'">'+
'<button class="btn pdf" id="prev1">Visualizar relatório – '+lbl()+'</button><button class="btn" id="pdf1" style="width:100%">Salvar em PDF</button><div class="sub" id="msg"></div>';
}
if(tab==="r"){
h+='<div class="two">'+msel()+'<select id="rsel"><option value="m"'+(rs==="m"?" selected":"")+'>Só o mês</option><option value="f"'+(rs==="f"?" selected":"")+'>Ano fiscal acumulado</option></select></div>';
var i4=-1;S.rg.forEach(function(r,i){if(i4<0&&/envolvido/i.test(r[0])&&/s4/i.test(r[0]))i4=i});
function s4(e){var t=0;if(i4<0)return 0;MS.forEach(function(m){if(rs!=="f"&&m.k!==mk)return;var p=pts(e,i4,m.k);if(p<0)t-=p});return t}
var L=EQ.map(function(e,i){return [e,i,rs==="f"?fy(e):tot(e,mk),s4(e)]}).sort(function(a,b){return b[2]-a[2]});
var mx=Math.max.apply(null,L.map(function(x){return x[2]<0?Math.abs(x[2]):x[2]+x[3]}).concat([1]));
L.forEach(function(x,k){h+='<div class="rk" data-s="'+x[1]+'"><div class="pos">'+(k+1)+'º</div><div class="b"><div class="nm">'+x[0]+'</div><div class="bar" style="display:flex">'+(x[2]<0?'<i style="width:'+Math.abs(x[2])/mx*100+'%;background:var(--neg)"></i>':'<i style="width:'+x[2]/mx*100+'%;background:var(--acc)"></i>'+(x[3]>0?'<i style="width:'+Math.max(x[3]/mx*100,8)+'%;background:#DC3A2D;min-width:10px"></i>':''))+'</div>'+(x[3]>0?'<div style="font-size:11px;color:#DC3A2D;margin-top:3px">● Envolvido em S4: −'+x[3]+' pts</div>':'')+'</div><div class="v '+cl(x[2])+'">'+sg(x[2])+'</div></div>'});
}
if(tab==="a"){
h+='<div class="sub">Ano fiscal: 01/06/2026 a 31/05/2027. Toque no nome para lançar.</div><div class="sc"><table><thead><tr><th>Colaborador</th>'+MS.map(function(x){return '<th>'+x.l+'</th>'}).join("")+'<th>Total</th></tr></thead><tbody>'+
EQ.map(function(e,i){return '<tr><td class="nn" data-s="'+i+'">'+e+'</td>'+MS.map(function(x){var t=tot(e,x.k);return '<td class="'+cl(t)+'">'+(t?sg(t):"–")+'</td>'}).join("")+'<td class="'+cl(fy(e))+'"><b>'+sg(fy(e))+'</b></td></tr>'}).join("")+
'<tr class="ttr"><td>Equipe</td>'+MS.map(function(x){var t=EQ.reduce(function(a,e){return a+tot(e,x.k)},0);return '<td>'+sg(t)+'</td>'}).join("")+'<td>'+sg(EQ.reduce(function(a,e){return a+fy(e)},0))+'</td></tr></tbody></table></div><button class="btn pdf" id="prev2">Visualizar ano fiscal</button><button class="btn" id="pdf2" style="width:100%">Salvar em PDF</button><div class="sub" id="msg"></div>';
}
if(tab==="g"){
h+='<div class="sub"><b>Sincronização com Google Drive</b></div><div class="c" style="padding:12px"><input type="text" id="syu" placeholder="Link do app Google (termina em /exec)" value="'+SY.url.replace(/"/g,"&quot;")+'" style="width:100%;margin-bottom:8px"><div class="two" style="grid-template-columns:1fr auto"><input type="password" id="syt" placeholder="Código de acesso" value="'+SY.t.replace(/"/g,"&quot;")+'"><button class="btn" id="syc" style="margin:0">'+(syOn()?'Salvar':'Conectar')+'</button></div><div class="sub" style="margin:6px 0 0">'+(syOn()?'Conectado. <span class="x" id="syd">desconectar</span> · ':'Ao conectar, se já houver dados na planilha, eles substituem os deste aparelho. ')+'Todos que usarem o mesmo link e código veem os mesmos dados.</div></div>';
h+='<div class="sub" style="margin-top:14px"><b>Colaboradores</b> (toque no nome para editar)</div><div class="c" style="padding:12px"><div class="two" style="grid-template-columns:1fr auto"><input type="text" id="nc" placeholder="Nome do novo colaborador"><button class="btn" id="addc" style="margin:0">Adicionar</button></div>'+
EQ.map(function(e,i){return '<div class="rg" style="grid-template-columns:1fr auto"><input type="text" data-en="'+i+'" value="'+e.replace(/"/g,"&quot;")+'" style="text-align:left">'+(i>=EQ0.length?'<span class="x" data-dc="'+(i-EQ0.length)+'">remover</span>':'<span></span>')+'</div>'}).join("")+'</div>';
h+='<div class="sub" style="margin-top:14px"><b>Itens de segurança e regras de pontos</b> (toque no nome para editar)</div><div class="c" style="padding:12px"><input type="text" id="ni" placeholder="Nome do novo item (ex.: Inspeção de área)" style="width:100%;margin-bottom:8px"><div class="two" style="grid-template-columns:1fr 1fr auto"><input type="number" id="nb" placeholder="Base (qtd)" value="1"><input type="number" id="np" placeholder="Pontos"><button class="btn" id="addi" style="margin:0">Adicionar</button></div><div class="sub" style="margin:6px 0 0">Ex.: base 4 e pontos 10 = a cada 4 ocorrências, 10 pontos (use negativo para desconto).</div></div>';
h+='<div class="sub" id="msg"></div><div class="c" style="margin-top:10px"><div class="rg hh" style="font-size:11px;color:var(--mut)"><span>Item</span><span>Base</span><span></span><span>Pontos</span></div>';
S.rg.forEach(function(r,i){if(r[5])return;h+='<div class="rg"><span><input type="text" data-in="'+i+'" value="'+r[0].replace(/"/g,"&quot;")+'" style="text-align:left">'+(r[3]?'<small> (%)</small>':'')+(i>=RG0.length?' <span class="x" data-di="'+i+'">remover</span>':'')+'</span><input type="number" data-g="1" data-i="'+i+'" value="'+r[1]+'"><span>=</span><input type="number" data-g="2" data-i="'+i+'" value="'+r[2]+'"></div>'});
h+='</div><button class="btn" id="sdf">Salvar como padrão</button> <button class="btn" id="rsr">Restaurar pontos padrão</button> <button class="btn" id="rsq">Zerar entregas de '+lbl()+'</button>';
}
document.getElementById("v").innerHTML=h}
document.addEventListener("click",function(e){var t=e.target;if(t.id==="th"){toggleTh();return}if(t.id==="rf"){refreshAll();return}
var c=t.closest?t.closest("[data-s]"):null,mm=t.closest?t.closest("[data-m]"):null;
if(t.dataset.t){tab=t.dataset.t;render()}
else if(c){sel=+c.dataset.s;tab="e";render();window.scrollTo(0,0)}
else if(mm){mk=mm.dataset.m;render();window.scrollTo(0,0)}
else if(t.dataset.dc!==undefined){S.xe.splice(+t.dataset.dc,1);bq();sel=0;sv();render()}
else if(t.dataset.di!==undefined){S.rg[+t.dataset.di][5]=1;sv();render()}
else if(t.id==="addc"){var nn=document.getElementById("nc").value.trim().replace(/\s+/g," ");
if(!nn){say("Digite o nome do colaborador.")}
else if(EQ.some(function(x){return x.toLowerCase()===nn.toLowerCase()})){say("Esse colaborador já existe.")}
else{S.xe.push(nn);bq();sv();render();say("Colaborador adicionado: "+nn)}}
else if(t.id==="addi"){var ni=document.getElementById("ni").value.trim(),nb=parseFloat(document.getElementById("nb").value),np=parseFloat(document.getElementById("np").value);
if(!ni||!(nb>0)||isNaN(np)){say("Informe nome, base (maior que 0) e pontos.")}
else{S.rg.push([ni,nb,np,0]);sv();render();say("Item adicionado: "+ni)}}
else if(t.id==="syc"){var u=document.getElementById("syu").value.trim(),c=document.getElementById("syt").value.trim();
if(!/^https:\/\/script\.google\.com\//.test(u)||!c){say("Informe o link do Google (começa com https://script.google.com) e o código de acesso.")}
else{SY={url:u,t:c};try{localStorage.setItem("pont_rel_sync",JSON.stringify(SY))}catch(e){}syBusy=false;syncNow(true);render()}}
else if(t.id==="syd"){SY={url:"",t:""};try{localStorage.removeItem("pont_rel_sync")}catch(e){}syMsg("");render()}
else if(t.id==="prev1")openPv("e");
else if(t.id==="prev2")openPv("a");
else if(t.id==="pvx"){var pv=document.getElementById("pv");if(pv)pv.remove()}
else if(t.id==="pvs"){if(t.dataset.k==="e")pdfE();else pdfA()}
else if(t.id==="pdf1")pdfE();
else if(t.id==="pdf2")pdfA();
else if(t.id==="sdf"){S.pd=S.rg.map(function(r){return [r[1],r[2]]});sv();t.textContent="✓ Salvo como padrão";setTimeout(function(){render()},1800)}
else if(t.id==="rsr"){S.rg.forEach(function(r,i){var d=(S.pd&&S.pd[i])||(RG0[i]?[RG0[i][1],RG0[i][2]]:null);if(d){r[1]=d[0];r[2]=d[1]}});sv();render()}
else if(t.id==="rsq"){S.q[mk]={};sv();render()}});
document.addEventListener("input",function(e){var t=e.target;
if(t.id==="ob"){S.ob[mk+"|"+EQ[sel]]=t.value;sv()}
else if(t.dataset.i!==undefined&&!t.dataset.g){var n=EQ[sel];S.q[mk]=S.q[mk]||{};S.q[mk][n]=S.q[mk][n]||{};S.q[mk][n][t.dataset.i]=t.value;sv();
updDv();
var p=pts(n,+t.dataset.i,mk),el=document.getElementById("p"+t.dataset.i);el.textContent=sg(p);el.className="pt "+cl(p);
var T=tot(n,mk),tt=document.getElementById("tt");tt.textContent=sg(T);tt.className=cl(T)}
else if(t.dataset.g){var v=parseFloat(t.value);if(!isNaN(v)&&(t.dataset.g==="2"||v>0)){S.rg[t.dataset.i][+t.dataset.g]=v;sv()}}});
document.addEventListener("change",function(e){var id=e.target.id;if(e.target.dataset&&e.target.dataset.i!==undefined&&!e.target.dataset.g)updDv();
if(e.target.dataset.en!==undefined){renameC(+e.target.dataset.en,e.target.value);return}
if(e.target.dataset.in!==undefined){renameI(+e.target.dataset.in,e.target.value);return}
if(id==="sl"){sel=+e.target.value;render()}
else if(id==="ms"){mk=e.target.value;render()}
else if(id==="rsel"){rs=e.target.value;render()}});
render();
if(syOn())syncNow(false);
</script>
